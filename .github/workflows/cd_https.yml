name: Deploy the backend server
on:
    push:
        branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code 
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}  
                password: ${{secrets.DOCKERHUB_TOKEN}}   


            - name: Build and push
              uses : docker/build-push-action@v6
              with:
                context: .
                file: ./docker/Dockerfile.https
                push: true
                tags: rummankhan/test-01-https:${{ github.sha }}
              
            - name: Deploy to the VM 
              run: |
               echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/Testing-01.pem
               chmod 700 /home/runner/Testing-01.pem
               ssh -o StrictHostKeyChecking=no -i ~Testing-01.pem ubuntu@ec2-16-16-76-74.eu-north-1.compute.amazonaws.com -t "docker stop user_backend && docker run --name user_backend -d -p 3002:3002 rummankhan/test-01-https:${{ github.sha}}"
